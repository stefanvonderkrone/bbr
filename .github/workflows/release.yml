name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare release identity
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            python3 tools/prepare_release.py >> "$GITHUB_OUTPUT"
          fi
      - name: Push release tag
        if: github.ref_type == 'branch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git push origin "refs/tags/$RELEASE_TAG"

  validate:
    name: validate identity
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2.2.2
        with:
          version: 0.16.0
          use-cache: false
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: sh tests/validate_release.sh "$RELEASE_TAG"

  build:
    name: build (${{ matrix.target }})
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-15-intel
            runner_os: macOS
            runner_arch: X64
          - target: macos-aarch64
            runner: macos-15
            runner_os: macOS
            runner_arch: ARM64
          - target: linux-x86_64
            runner: ubuntu-24.04
            runner_os: Linux
            runner_arch: X64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            runner_os: Linux
            runner_arch: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2.2.2
        with:
          version: 0.16.0
          use-cache: false
      - name: Verify native target
        env:
          EXPECTED_OS: ${{ matrix.runner_os }}
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
        run: |
          test "$RUNNER_OS" = "$EXPECTED_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
      - name: Run hermetic tests
        run: zig build test --summary all
      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe --summary all
      - name: Check version and package binary
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          commit=$(git rev-parse HEAD)
          expected="bbr ${RELEASE_TAG#v}+g${commit:0:12}"
          test "$(./zig-out/bin/bbr --version)" = "$expected"
          mkdir -p "$RUNNER_TEMP/release"
          archive="$RUNNER_TEMP/release/bbr-$RELEASE_TAG-$TARGET.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C zig-out/bin bbr
          test "$(tar -tzf "$archive")" = bbr
      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bbr-${{ matrix.target }}
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bbr-*
          path: dist
          merge-multiple: true
      - name: Create checksums and publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          sha256sum -- ./*.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
            --verify-tag --generate-notes --title "bbr $RELEASE_TAG" --latest
