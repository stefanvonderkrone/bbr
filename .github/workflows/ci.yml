name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-docs:
    name: agent documents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test document validator
        run: python3 tests/check_agent_docs_test.py
      - name: Check agent documents and tracker
        run: python3 tools/check_agent_docs.py

  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-15-intel
            runner_os: macOS
            runner_arch: X64
          - target: macos-aarch64
            runner: macos-15
            runner_os: macOS
            runner_arch: ARM64
          - target: linux-x86_64
            runner: ubuntu-24.04
            runner_os: Linux
            runner_arch: X64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            runner_os: Linux
            runner_arch: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2.2.2
        with:
          version: 0.16.0
          cache-key: ${{ matrix.target }}
          cache-size-limit: 2048
      - name: Verify native target
        env:
          EXPECTED_OS: ${{ matrix.runner_os }}
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
        run: |
          test "$RUNNER_OS" = "$EXPECTED_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
      - name: Check formatting
        if: matrix.target == 'linux-x86_64'
        run: zig fmt --check build.zig src tests
      - name: Test release preparation
        if: matrix.target == 'linux-x86_64'
        run: python3 tests/prepare_release_test.py
      - name: Test release publication
        if: matrix.target == 'linux-x86_64'
        run: python3 tests/publish_release_test.py
      - name: RE2 wrapper
        run: zig build test-re2 --summary all
      - name: Dynamic UserGrammar load
        run: zig build test-user-grammar-load --summary all
      - name: UserGrammar CLI lifecycle
        run: zig build test-user-grammar --summary all
      - name: Complete hermetic suite
        run: zig build test --summary all
      - name: Install External Edit test tools
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux neovim
      - name: Build bbr
        if: matrix.target == 'linux-x86_64'
        run: zig build --summary all
      - name: External Edit terminal lifecycle
        if: matrix.target == 'linux-x86_64'
        run: python3 tests/external_edit_pty_test.py
